name: Bug report
description: Report a defect with clear reproduction steps and evidence.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Observed result
      description: State what happened.
      placeholder: The donation status page displays...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: State what should happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List one action in each step.
      placeholder: |
        1. Open...
        2. Select...
        3. Submit...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Preview
        - Local development
        - Other
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add safe screenshots, logs, URLs, and timestamps. Remove secrets and personal data.
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact and scope
      description: State who is affected and what they cannot do.
    validations:
      required: true
