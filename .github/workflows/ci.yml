name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; superseded pushes cancel rather than queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs strictly from the committed lockfile.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Builds with temporary content and asserts against the running server:
      # published stories included, scheduled stories excluded, canonical URLs.
      - name: Verify sitemap
        run: node scripts/verify-sitemap.mjs

      # Drives a real production server against mock Paystack and Supabase
      # services, so no real payment is created and no real data is touched.
      - name: Verify donation integrity
        run: node scripts/verify-donations.mjs
