name: CI

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per ref; superseded pushes cancel rather than queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci installs strictly from the committed lockfile.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # Publishing rules and content validation. Uses Node's built-in test runner,
      # so no test framework is installed.
      - name: CMS unit tests
        run: npm run test:cms

      # Proves the row-level security policies against a real PostgreSQL instance:
      # drafts, scheduled content and unverified figures must stay hidden, and a
      # signed-in non-administrator must not be able to write. The GitHub runner has
      # Docker, so these run for real rather than being skipped.
      - name: Row-level security tests
        run: npm run test:rls

      - name: Build
        run: npm run build

      # Builds with temporary content and asserts against the running server:
      # published stories included, scheduled stories excluded, canonical URLs.
      - name: Verify sitemap
        run: node scripts/verify-sitemap.mjs
