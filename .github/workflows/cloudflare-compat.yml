name: Cloudflare compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "next.config.*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/cloudflare-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Check Next.js compatibility with vinext
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Run pinned vinext compatibility scan
        run: npx --yes vinext@1.4.5 check
